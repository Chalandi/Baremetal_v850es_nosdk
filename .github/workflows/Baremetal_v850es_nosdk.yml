name: Baremetal_v850es_nosdk
on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install Toolchain
        run: |
          wget -q https://github.com/ckormanyos/gcc-v850-unknown-elf/releases/download/v16.2.0/gcc-16.2.0-v850-unknown-elf.tar.gz
          tar -xf gcc-16.2.0-v850-unknown-elf.tar.gz

      - name: Build Binary
        shell: bash
        run: |
          export TOOLCHAIN_GCC=$GITHUB_WORKSPACE/gcc-16.2.0-v850-unknown-elf/bin/
          export PATH=$TOOLCHAIN_GCC:$PATH
          cd $GITHUB_WORKSPACE/Build
          chmod +x Rebuild.sh
          ./Rebuild.sh
